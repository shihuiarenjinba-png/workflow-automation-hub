name: Store hardening regression (audit branch)
on:
  push:
    branches:
      - 'audit/store-release-hardening-20261019'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify syntax
        run: python -m compileall -q automation_hub tests desktop_app.py
      - name: Run full regression
        run: python -m unittest discover -s tests -v
