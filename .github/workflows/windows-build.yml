name: Windows build / Windowsビルド

on:
  push:
    branches:
      - main
      - feature/desktop-blogger-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout / チェックアウト
        uses: actions/checkout@v4
      - name: Set up Python / Python設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies / 依存関係
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Unit tests / ユニットテスト
        run: python -m unittest discover -s tests -v
      - name: Build EXE / EXE作成
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name WorkflowAutomationHub --add-data "resources;resources" --collect-all googleapiclient --collect-all google_auth_oauthlib desktop_app.py
      - name: Upload EXE / EXEを保存
        uses: actions/upload-artifact@v4
        with:
          name: WorkflowAutomationHub-Windows
          path: dist/WorkflowAutomationHub.exe
          if-no-files-found: error
