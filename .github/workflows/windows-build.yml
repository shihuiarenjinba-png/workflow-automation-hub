name: Windows build / Windowsビルド

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout exact source / 正確なソースをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python / Python設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies / 依存関係
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Verify dependencies / 依存整合性
        run: python -m pip check
      - name: Unit tests / ユニットテスト
        run: python -m unittest discover -s tests -v
      - name: Capture GUI review evidence / GUI画面証跡
        run: python tools/capture_gui_review.py
      - name: Upload sanitized GUI screenshots / 模擬画面の証跡を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorkflowAutomationHub-GUI-Review
          path: gui-review-evidence/
          if-no-files-found: warn
      - name: Source self-test / ソース自己診断
        run: python desktop_app.py --self-test
      - name: Source diagnostics privacy check / 診断レポート確認
        shell: pwsh
        run: |
          python desktop_app.py --diagnose source_support_report.json
          if ($LASTEXITCODE -ne 0) { throw "Source diagnostics failed" }
          python -c "import json; p=json.load(open('source_support_report.json', encoding='utf-8')); assert p['overall_ok']; assert not any(p['privacy'][k] for k in ['contains_oauth_token','contains_client_secret','contains_username','contains_full_paths'])"
      - name: Verify committed dependency evidence / コミット済み依存証跡を検証
        shell: pwsh
        run: |
          python -c "import json; p=json.load(open(r'SBOM.cyclonedx.json', encoding='utf-8')); assert p['bomFormat']=='CycloneDX'; assert p['specVersion']=='1.6'; assert len(p['components']) > 0"
          if ($LASTEXITCODE -ne 0) { throw "SBOM validation failed" }
          $files = @('SBOM.cyclonedx.json','THIRD_PARTY_NOTICES.md','requirements-lock.txt')
          foreach ($file in $files) {
            if (-not (Test-Path $file) -or (Get-Item $file).Length -le 0) { throw "Missing dependency evidence: $file" }
          }
      - name: Build EXE / EXE作成
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WorkflowAutomationHub --add-data "resources;resources" --collect-all googleapiclient --collect-all google_auth_oauthlib desktop_app.py
          if (-not (Test-Path "dist\WorkflowAutomationHub.exe")) { throw "EXE was not created" }
      - name: Packaged EXE self-test / EXE自己診断
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\WorkflowAutomationHub.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged EXE self-test failed with exit code $($process.ExitCode)" }
      - name: Build unsigned Store MSIX draft / 未署名のStore下書きMSIX
        shell: pwsh
        run: |
          ./store/build_msix_draft.ps1 -ExePath "dist/WorkflowAutomationHub.exe" -OutputDirectory "store-out"
          if ($LASTEXITCODE -ne 0) { throw "Store MSIX draft build failed" }
          $report = Get-Content "store-out/msix_validation.json" -Raw | ConvertFrom-Json
          if (-not $report.manifest_identity_verified -or $report.makeappx_pack_unpack -ne 'PASS') { throw 'MSIX roundtrip verification failed' }
          if ($report.signed -or $report.store_submission_approved -or $report.sale_approved) { throw 'Unexpected sales approval on draft package' }
          if ($report.store_id -cne "9P6SXJNNB5KK") { throw "Wrong Store ID" }
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($report.source_commit -cne $actualCommit) { throw "MSIX source commit mismatch" }
      - name: Upload UNSIGNED non-release Store MSIX / 未署名検証MSIXを保存
        uses: actions/upload-artifact@v4
        with:
          name: WorkflowAutomationHub-Store-MSIX-UNSIGNED-DRAFT
          path: |
            store-out/*.msix
            store-out/msix_validation.json
            store-out/msix.sha256.txt
          if-no-files-found: error
      - name: Upload non-package build evidence / ZIP前ビルド証跡を保存
        uses: actions/upload-artifact@v4
        with:
          name: WorkflowAutomationHub-Windows
          path: |
            dist/WorkflowAutomationHub.exe
            SBOM.cyclonedx.json
            THIRD_PARTY_NOTICES.md
            requirements-lock.txt
          if-no-files-found: error
